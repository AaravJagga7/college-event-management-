apiVersion: apps/v1
kind: Deployment
metadata:
  name: rvce-event-intelligence-api
  labels:
    app: rvce-event-intelligence
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rvce-event-intelligence
  template:
    metadata:
      labels:
        app: rvce-event-intelligence
    spec:
      containers:
      - name: inference-api
        image: rvce-event-intelligence-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: APP_ENV
          value: "production"
        - name: PORT
          value: "8000"
        - name: HOST
          value: "0.0.0.0"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: rvce-event-intelligence-service
  labels:
    app: rvce-event-intelligence
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: rvce-event-intelligence
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rvce-event-intelligence-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rvce-event-intelligence-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75

