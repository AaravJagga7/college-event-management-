name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, "release/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. CODE QUALITY & LINTING
  # ============================================================================
  lint:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Syntax Check & Code Formatting Check
        run: |
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics
          black --check app tests --line-length=120 || true

  # ============================================================================
  # 2. MODEL TESTING & MODEL-RISK QUALITY GATES
  # ============================================================================
  model-quality-gates:
    name: Model Testing & Risk Verification
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Production & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Model Performance Quality Gates
        run: |
          pytest tests/test_model_performance.py -v -s

      - name: Execute Model-Risk, Monotonicity & Fairness Checks
        run: |
          pytest tests/test_model_risk_quality.py -v -s

  # ============================================================================
  # 3. FASTAPI INFERENCE SERVICE TESTS
  # ============================================================================
  api-integration-tests:
    name: API Endpoint & Schema Tests
    runs-on: ubuntu-latest
    needs: [model-quality-gates]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API Tests with Coverage
        run: |
          pytest tests/test_api.py --cov=app --cov-report=term-missing --cov-report=xml

  # ============================================================================
  # 4. DOCKER BUILD & CONTAINER SMOKE TEST
  # ============================================================================
  docker-build-test:
    name: Docker Containerization & Smoke Test
    runs-on: ubuntu-latest
    needs: [api-integration-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t rvce-event-intelligence-api:${{ github.sha }} -t rvce-event-intelligence-api:latest .

      - name: Run Container & Test Health Probe
        run: |
          docker run -d --name test-api-container -p 8000:8000 rvce-event-intelligence-api:latest

          echo "Waiting for container startup and model pre-warming..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Container health check passed with HTTP 200!"
              break
            fi
            sleep 1
          done

          # Container liveness verification
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/ready

          # Container inference smoke test
          curl -X POST http://localhost:8000/predict/attendance \
            -H "Content-Type: application/json" \
            -d '{
              "month": 11, "day_of_week": 4, "is_saturday": 0, "week_of_year": 46,
              "is_exam_season": 1, "hour": 15, "is_afternoon": 1, "duration_min": 90,
              "lead_days": 7, "type_level": 2, "designation_level": 2, "room_no": 101,
              "room_capacity": 350, "faculty_event_count": 40, "room_usage_count": 70,
              "earlier_clash_count": 0, "cat_academic": 0, "cat_cultural": 1,
              "cat_fun_club": 0, "cat_sports": 0, "cat_technical": 0
            }'

      - name: Stop Test Container
        if: always()
        run: |
          docker stop test-api-container || true
          docker rm test-api-container || true

  # ============================================================================
  # 5. CONTINUOUS DEPLOYMENT (TRIGGER ON MERGE TO MAIN)
  # ============================================================================
  deploy:
    name: Automated Deployment
    runs-on: ubuntu-latest
    needs: [docker-build-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deployment Simulation / Staging Rollout
        run: |
          echo "============================================================"
          echo "🚀 Initiating Zero-Downtime Deployment to Production Cluster"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Timestamp:  $(date -u)"
          echo "Registry:   Kubeflow Model Registry (Production Stage)"
          echo "Service:    rvce-event-intelligence-api:latest"
          echo "============================================================"
          echo "✅ All Quality Gates Verified (R2, F1, AUC, Latency, Risk Checks)"
          echo "✅ Container Healthcheck Verified"
          echo "✅ Production Deployment Succeeded!"
