# ==============================================================================
# Jenkins Configuration as Code (JCasC) — Master-Slave & Multibranch Pipeline
# ==============================================================================
# 1. Configures Master (Controller) with 0 executors to prevent build overload.
# 2. Automatically provisions 'mlops-agent-01' Slave Worker over SSH.
# 3. Defines Multibranch Pipeline Job auto-discovering all repository branches.
# ==============================================================================

jenkins:
  systemMessage: "⚡ RVCE 8th Mile MLOps Platform — Master Controller & Dedicated Slave Agent"
  numExecutors: 0
  mode: EXCLUSIVE
  scmCheckoutRetryCount: 3
  
  # ----------------------------------------------------------------------------
  # Slave Agent Configuration (Controller-Agent Architecture)
  # ----------------------------------------------------------------------------
  nodes:
    - permanent:
        name: "mlops-agent-01"
        nodeDescription: "Dedicated Python/Docker/Vercel MLOps Execution Worker"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 2
        mode: NORMAL
        labelString: "mlops-agent python docker vercel linux"
        launcher:
          ssh:
            host: "jenkins-agent"
            port: 22
            credentialsId: "agent-ssh-key"
            sshHostKeyVerificationStrategy: "nonVerifyingKeyVerificationStrategy"
            maxNumRetries: 10
            retryWaitTime: 5

# ------------------------------------------------------------------------------
# System Credentials Store
# ------------------------------------------------------------------------------
credentials:
  system:
    domainCredentials:
      - credentials:
          # SSH Private Key to connect Master -> Slave Agent
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "agent-ssh-key"
              username: "jenkins"
              description: "SSH Private Key for Jenkins Slave Agent Node"
              privateKeySource:
                fileOnMaster:
                  privateKeyFile: "/var/jenkins_home/secrets/agent_rsa"
          # Vercel Deployment Tokens
          - string:
              scope: GLOBAL
              id: "VERCEL_TOKEN"
              secret: "${VERCEL_TOKEN}"
              description: "Vercel API Authentication Secret Token"
          - string:
              scope: GLOBAL
              id: "VERCEL_PROJECT_ID"
              secret: "${VERCEL_PROJECT_ID}"
              description: "Vercel Target Project Identifier"
          - string:
              scope: GLOBAL
              id: "VERCEL_ORG_ID"
              secret: "${VERCEL_ORG_ID}"
              description: "Vercel Organization Identifier"

# ------------------------------------------------------------------------------
# Automated Multibranch Pipeline Definition (Job DSL)
# ------------------------------------------------------------------------------
jobs:
  - script: >
      multibranchPipelineJob('rvce-event-intelligence-multibranch') {
        description('Multi-Branch MLOps Pipeline: Feature branches -> Staging preview -> Main production')
        displayName('RVCE 8th Mile Multi-Branch MLOps Pipeline')
        
        branchSources {
          branchSource {
            source {
              git {
                id('rvce-8th-mile-git')
                remote('https://github.com/AaravJagga7/college-event-management-.git')
                traits {
                  gitBranchDiscovery()
                  cleanBeforeCheckoutTrait()
                }
              }
            }
            strategy {
              allBranchesSame()
            }
          }
        }
        
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(10)
            daysToKeep(30)
          }
        }
        
        triggers {
          periodicFolderTrigger {
            interval('5m')
          }
        }
        
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
      }

