version: '3.8'

# ==============================================================================
# Jenkins Master-Slave (Controller-Agent) Architecture with Docker Compose
# ==============================================================================
# Controller (Master): Runs web UI, schedules multibranch jobs, manages JCasC config
# Agent (Slave): Dedicated worker executing Python tests, Docker builds, Vercel deploys
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Jenkins Master (Controller) Node
  # ----------------------------------------------------------------------------
  jenkins-controller:
    build:
      context: ./controller
      dockerfile: Dockerfile
    image: rvce-jenkins-controller:lts
    container_name: rvce_jenkins_controller
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs/jenkins.yml
      - VERCEL_TOKEN=${VERCEL_TOKEN:-}
      - VERCEL_ORG_ID=${VERCEL_ORG_ID:-}
      - VERCEL_PROJECT_ID=${VERCEL_PROJECT_ID:-}
    volumes:
      - jenkins_controller_data:/var/jenkins_home
      - ./jenkins.yml:/var/jenkins_home/casc_configs/jenkins.yml:ro
      - ./keys/agent_rsa:/var/jenkins_home/secrets/agent_rsa:ro
    networks:
      - jenkins-net

  # ----------------------------------------------------------------------------
  # Jenkins Slave (Worker) Node
  # ----------------------------------------------------------------------------
  jenkins-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: rvce-jenkins-agent:lts
    container_name: rvce_jenkins_agent
    restart: unless-stopped
    expose:
      - "22"
    environment:
      - JAVA_OPTS=-Dfile.encoding=UTF-8
    volumes:
      - jenkins_agent_data:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock
      - ./keys/agent_rsa.pub:/home/jenkins/.ssh/authorized_keys:ro
    networks:
      - jenkins-net
    depends_on:
      - jenkins-controller

networks:
  jenkins-net:
    name: rvce_jenkins_net
    driver: bridge

volumes:
  jenkins_controller_data:
    name: rvce_jenkins_controller_data
  jenkins_agent_data:
    name: rvce_jenkins_agent_data
